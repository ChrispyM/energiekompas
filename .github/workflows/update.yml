name: Gegevens verversen

on:
  schedule:
    - cron: '7 * * * *'      # elk uur, op minuut 7
  workflow_dispatch:         # ook met de hand te starten

permissions:
  contents: write

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Weer en prijzen ophalen
        run: python update.py || echo "update.py meldde een probleem, zie hierboven"
      - name: Vastleggen als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Gegevens ververst" && git push)
