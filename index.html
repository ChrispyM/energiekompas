<template id="guide-tpl">
<div class="card guide">
<h2>Wat deze app voor je doet</h2>
<p>Energiekompas vertelt je per uur wanneer stroom en warmte het goedkoopst zijn in jouw huis, en wat je dan het best kunt doen: de vaatwasser, wasmachine, droger en inductieplaat starten, de vloerverwarming extra laten opwarmen of juist laten rusten, en de houtkachel aansteken. Het houdt rekening met je dynamische contract, je zonnepanelen, de isolatie, de weersverwachting en de begrenzing van je aansluiting.</p>
<p class="muted small">Alle bedragen zijn schattingen op basis van de ingevulde gegevens. De app stuurt niets aan: jij start de apparaten zelf.</p>
</div>

<div class="card guide">
<h2>Zo gebruik je hem</h2>
<ul class="tip">
<li><b>Dag kiezen:</b> bovenaan kies je vandaag, morgen of overmorgen. Voor vandaag telt alleen wat nog komt. Uren die voorbij zijn, staan gedimd.</li>
<li><b>Overzicht:</b> het beste moment voor stroom, de prijs per uur, de zonopbrengst en een korte lijst met wat je nu kunt doen. De schuifbalk onder elke grafiek toont de waarde op een uur. Sleep over de grafiek.</li>
<li><b>Apparaten:</b> per apparaat het goedkoopste startuur. De planning houdt je aansluiting in de gaten: apparaten die samen te veel vragen, worden verschoven.</li>
<li><b>Verwarming:</b> het verwachte verloop van de binnentemperatuur, wanneer je de vloerverwarming laat opwarmen, wat gas of de warmtepomp kost, en het stookadvies voor de houtkachel.</li>
<li><b>Instellingen:</b> bovenaan staan je <b>Metingen binnen</b>: welke waarden je hebt ingevuld en wanneer. Daaronder je woning, panelen, tarieven en apparaten. Alles wat je wijzigt, wordt op dit apparaat bewaard en meteen doorgerekend.</li>
<li><b>Sensors:</b> de temperatuur en luchtvochtigheid beneden en boven komen elk uur vanzelf uit eWeLink. Bovenaan zie je of dat lukt: groen <b>Sensors verbonden</b> betekent dat beide sensors de afgelopen 3 uur iets hebben doorgegeven. Oranje of rood betekent dat een of beide sensors niets recents hebben gemeld.</li>
</ul>
</div>

<div class="card guide">
<h2>Vul dit eerst in</h2>
<p>De standaardwaarden zijn een redelijke gok. Deze zes instellingen bepalen het meest:</p>
<ul class="tip">
<li><b>Belasting en opslag per kWh:</b> kijk in je contract of in de app van je leverancier. Vergelijk één uurprijs met wat de app toont en pas het getal aan tot ze overeenkomen.</li>
<li><b>Woonoppervlak, vloerverwarming en isolatie:</b> het oppervlak met vloerverwarming (beneden) en het totale oppervlak. Kies bij isolatie het niveau dat bij je energielabel past.</li>
<li><b>Zonnepanelen:</b> totaal vermogen in kWp, richting en hellingshoek.</li>
<li><b>Aansluiting:</b> de grootte van je aansluiting (bijvoorbeeld 17,3 kW). De app houdt 20% marge.</li>
<li><b>Metingen binnen:</b> de temperatuur en luchtvochtigheid beneden en boven. Handmatige waarden gelden 8 uur.</li>
<li><b>Gasprijs en terugleverkosten:</b> te vinden op je jaarnota of in de app van je leverancier.</li>
</ul>
</div>

<div class="card guide">
<h2>Hoe er gerekend wordt</h2>
<ul class="tip">
<li><b>Stroomprijs:</b> de beursprijs van de volgende dag (EPEX day-ahead, uurgemiddelde) maal 1,21 btw, plus je opslag. Zijn de beursprijzen nog niet bekend, dan toont de app een typisch verloop en zegt dat erbij. Je kunt ook je eigen prijzen plakken.</li>
<li><b>Terugleveren:</b> bij een dynamisch contract volgt de terugleverprijs de beurs. Is die negatief, dan kost terugleveren geld en loont het om zonnestroom zelf te gebruiken.</li>
<li><b>Zonopbrengst:</b> uit de stand van de zon en de straling die het weermodel voorspelt. Zonder modelstraling schat de app die uit de bewolking.</li>
<li><b>Warmte:</b> het huis verliest warmte naar buiten, wint zon en interne warmte, en de vloer slaat warmte op. Per uur kiest de app de goedkoopste bron (warmtepomp of gas). De elektrische panelen boven rekenen tegen de volle stroomprijs.</li>
<li><b>Slim stoken:</b> de vloer mag een halve graad rond de gewenste temperatuur schommelen. Hij warmt op in de goedkope uren en rust in de dure.</li>
<li><b>Houtkachel:</b> de app zoekt de avonduren met de duurste warmte en een grote warmtevraag. Alleen de benedenverdieping profiteert mee, dus het voordeel zit vooral in comfort.</li>
</ul>
</div>

<div class="card guide">
<h2>Ventileren op luchtvochtigheid</h2>
<p>Het blok <b>Ventileren</b> op het overzicht gebruikt de metingen die je invult. De app rekent de relatieve luchtvochtigheid om naar hoeveel vocht er echt in de lucht zit (gram per m³) en vergelijkt dat met de buitenlucht per uur. Is het buiten droger, dan haalt ventileren vocht weg. Is het buiten vochtiger, dan helpt het niet.</p>
<ul class="tip">
<li><b>40 tot 60%</b> is goed. Ventileren hoeft dan niet extra.</li>
<li><b>60 tot 70%</b> is aan de hoge kant, <b>boven 70%</b> te vochtig: kans op schimmel en condens.</li>
<li><b>Onder 40%</b> is droog. Extra ventileren maakt dat meestal erger.</li>
<li>Je krijgt de beste uren (tussen 08:00 en 22:00), de kosten van een kwartier ramen open en wat je met je warmteterugwinning kunt doen. Boven let de app op koude, vochtige kamers.</li>
<li>De buitenvochtigheid komt uit de weersverwachting. Ontbreekt die, dan rekent de app met 85% en zegt dat erbij.</li>
</ul>
</div>

<div class="card guide">
<h2>Wat de app niet weet</h2>
<ul class="tip">
<li>Hij ziet je P1-meter en je Enphase-omvormer niet rechtstreeks. De sensors binnen komen via eWeLink, met maximaal een uur vertraging.</li>
<li>De leveranciersopslag, je werkelijke warmteverlies en de COP van je warmtepomp zijn schattingen. Zie het als richting.</li>
<li>De binnentemperatuur in de grafiek is een berekening, geen meting, tenzij de sensor beneden de afgelopen 3 uur iets heeft gemeld.</li>
<li>Het buitenweer komt uit een verwachting. Bij plotselinge wolken of regen kan de zonopbrengst afwijken.</li>
</ul>
</div>

<div class="card guide">
<h2>Gegevens en bronnen</h2>
<ul class="tip">
<li><b>Weer:</b> KNMI HARMONIE (2 km boven Nederland) en ECMWF via Open-Meteo.com, met MET Norway als reserve. In de voettekst staat welke bron actief is.</li>
<li><b>Prijzen:</b> EPEX day-ahead Nederland via Energy-Charts. Rond 13:00 verschijnen de prijzen van de volgende dag.</li>
<li><b>Gas:</b> een gemiddeld consumententarief dat je zelf instelt. De groothandelsprijs (TTF) is alleen ter informatie.</li>
<li><b>Ververs:</b> de pagina haalt bij openen en daarna elk half uur zelf nieuwe gegevens op, als de browser dat toestaat. Staat dat uit, dan gebruikt hij het bestand data.json dat elk uur wordt bijgewerkt.</li>
</ul>
<p class="muted small">Open-Meteo is gratis voor niet-commercieel gebruik (CC BY 4.0). MET Norway: CC BY 4.0.</p>
</div>

<div class="card guide">
<h2>Online zetten zonder eigen computer</h2>
<p>De pagina is één bestand met een paar hulpbestanden. Hij draait volledig in je browser, dus je hebt geen server nodig. Zet de map op een gratis hostingdienst en open het adres op elk apparaat, ook buiten je wifi.</p>
<p style="margin-top:10px"><b>Route A: GitHub Pages (aanbevolen, ververst zelf elk uur)</b></p>
<ol class="steps">
<li>Maak een gratis account op github.com en kies rechtsboven + en dan <b>New repository</b>. Geef hem de naam <b>energiekompas</b> en kies <b>Public</b>. Kies <b>Create repository</b>.</li>
<li>Kies <b>uploading an existing file</b> en sleep alle bestanden uit de zip erin, behalve <b>update.yml</b> (dat is stap 3). Kies <b>Commit changes</b>.</li>
<li>Kies <b>Add file</b>, dan <b>Create new file</b>. Typ als naam <b>.github/workflows/update.yml</b> (typ de schuine strepen mee, dan ontstaan de mappen vanzelf) en plak de inhoud van <b>update.yml</b> uit de zip. Kies <b>Commit changes</b>.</li>

function compute(di){

    return {h:x.h,ms:x.ms,temp:x.temp,cloud:x.cloud,rh:x.rh,el:x.el,ghi:r.ghi,poa:r.poa,pv:st.kwp*r.poa/1000*0.82};
  });

  var pp=parsePrices(st.prices[day.key]);

  else if(ex&&ex.length===24){c.price=ex.map(function(v){return v/1000*1.21+st.opslag;});c.src='epex';}

  c.tmin=Math.min.apply(null,hrs.map(function(h){return h.temp;}));

    s+='<div class="cell '+c+(isBest?' best':'')+(minH&&i<minH?' past':'')+'">'+(i%3===0?pad(i):'')+'</div>';
  }
  return s+'</div>';
}

/* Tegel Binnen nu: per verdieping temperatuur en vochtigheid, met meettijd. */
function indoorStat(){
  var rows=[['Beneden',measRec('ben')],['Boven',measRec('bov')]],any=false,h='';
  rows.forEach(function(r){
    var x=r[1],ok=x&&Date.now()-x.at<(x.auto?3:8)*3600000;
    if(ok)any=true;
    h+='<div class="inrow"><span class="inloc">'+r[0]+'</span>'
      +(ok?'<span class="val">'+nf(x.t,1)+' °C</span><span class="inh">'+(x.h?nf(x.h,0)+'%':'')+'</span><span class="sub">'+clock(x.at)+'</span>'
          :'<span class="sub">geen recente meting</span>')+'</div>';
  });

/* Status van de koppeling met de sensors (indoor.json uit eWeLink). Vers = binnen 3 uur. */
function sensorState(){
  if(!IND)return {c:'b',t:'Sensors niet verbonden',d:'indoor.json is niet gevonden of niet te lezen.'};
  var now=Date.now(),fresh=[],last=0,names={beneden:'beneden',boven:'boven'};
  Object.keys(names).forEach(function(k){var a=IND[k];if(a&&typeof a.at==='number'){last=Math.max(last,a.at);if(now-a.at<3*3600000)fresh.push(k);}});
  var d=last?'Laatste meting '+clock(last)+' ('+ageTxt(last)+').':'Nog geen meting ontvangen.';
  if(fresh.length===2)return {c:'g',t:'✓ Sensors verbonden',d:d};
  if(fresh.length===1)return {c:'m',t:'Sensor '+(fresh[0]==='beneden'?'boven':'beneden')+' geen recente meting',d:d};
  return {c:'b',t:last?'Sensors: geen meting sinds '+clock(last):'Sensors niet verbonden',d:d};
}

function showTab(t){

function init(){
  load();
  ui.day=0;
  if(['overzicht','apparaten','verwarming','instellingen','handleiding'].indexOf(ui.tab)<0)ui.tab='overzicht';
  var stale=SNAP.fetched&&(Date.now()-SNAP.fetched>30*3600000);
  $('stamp').textContent='Weer van '+SNAP.stamp+(stale?' · verouderd':'');
  if(SNAP.src)$('wxsrc').textContent='Weergegevens: '+SNAP.src+'.';
  buildSettings();
  measStatus();
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)showTab(b.getAttribute('data-tab'));});
  $('days').addEventListener('click',function(e){var b=e.target.closest('button[data-day]');if(!b)return;ui.day=+b.getAttribute('data-day');saveUi();renderActive();});
  $('p-instellingen').addEventListener('click',function(e){
    if(e.target.id==='meas-clear'){st.meas={ben:{t:0,h:0,at:0},bov:{t:0,h:0,at:0}};save();measRemoteSave();afterMeasChange();}
  });
  $('p-instellingen').addEventListener('change',function(e){
    var t=e.target;
    if(t.hasAttribute('data-meas')){
      var pp=t.getAttribute('data-meas').split('.'),loc=pp[0],fld=pp[1],v=parseNum(t.value),max=fld==='t'?40:100,min=5,er=$('meas-err');
      if(v!==null&&(isNaN(v)||v<min||v>max)){er.textContent=(fld==='t'?'Temperatuur':'Luchtvochtigheid')+' moet tussen '+min+' en '+max+(fld==='t'?' °C':'%')+' liggen.';return;}
      er.textContent='';
      var m=st.meas[loc];m[fld]=v===null?0:v;m.at=(m.t>0||m.h>0)?Date.now():0;
      save();measRemoteSave();cache={};measStatus();renderActive();return;
    }
    if(t.hasAttribute('data-path')){
      var p=t.getAttribute('data-path'),v;
      if(t.type==='checkbox')v=t.checked;
      else if(t.type==='number'){v=parseFloat(String(t.value).replace(',','.'));if(!isFinite(v))return;}
      else{v=t.value;var cur=getPath(st,p);if(typeof cur==='number')v=parseFloat(v);}
      setPath(st,p,v);save();
    }else if(t.hasAttribute('data-price')){
      st.prices[t.getAttribute('data-price')]=t.value;save();
      var pp=parsePrices(t.value),old=t.parentNode.querySelector('.err');if(old)old.remove();
      if(pp&&pp.error){var m=document.createElement('div');m.className='err';m.textContent=pp.error;t.parentNode.appendChild(m);}
    }
  });
  $('p-instellingen').addEventListener('click',function(e){
    if(e.target.id!=='reset')return;
    var b=e.target;
    if(b.getAttribute('data-sure')==='1'){st=clone(DEF);save();buildSettings();$('resetmsg').textContent='Teruggezet naar de standaardwaarden.';}
    else{b.setAttribute('data-sure','1');b.textContent='Klik nog een keer om te bevestigen';}
  });
  var rt=null;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(ui.tab!=='instellingen'&&ui.tab!=='handleiding')renderActive();},150);});
  showTab(ui.tab);
}
/* Optioneel: data.json (weer en prijzen) en settings.json (eigen standaardwaarden) naast deze pagina.
   Ontbreken ze, dan gebruikt de pagina de gegevens die erin zijn opgenomen. */
function getJson(url){
  return fetch(url,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
}
function applyData(d){
  if(!d||typeof d!=='object'||typeof d.start!=='number'||!Array.isArray(d.temp)||!Array.isArray(d.cloud)||d.temp.length!==d.cloud.length||d.temp.length<24)return;
  ['start','stamp','temp','cloud','ghi','dni','dhi','rh','src','epex','epexStamp','ttf','fetched'].forEach(function(k){if(d[k]!==undefined)SNAP[k]=d[k];});
  ['ghi','dni','dhi','rh'].forEach(function(k){if(SNAP[k]&&(!Array.isArray(SNAP[k])||SNAP[k].length!==SNAP.temp.length||SNAP[k].some(function(v){return typeof v!=='number'||!isFinite(v);}))){if(k==='rh')delete SNAP.rh;else{delete SNAP.ghi;delete SNAP.dni;delete SNAP.dhi;}}});
  if(typeof d.lat==='number'&&typeof d.lon==='number'){LAT=d.lat;LON=d.lon;}
}

/* ---------- Live verversen in de browser (weer van KNMI HARMONIE via Open-Meteo, prijzen van Energy-Charts) ---------- */
function fetchJson(url,ms){
  return new Promise(function(resolve,reject){
    var done=false,tm=setTimeout(function(){if(!done){done=true;reject(new Error('time-out'));}},ms||9000);
    fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){if(!done){done=true;clearTimeout(tm);resolve(j);}}).catch(function(e){if(!done){done=true;clearTimeout(tm);reject(e);}});
  });
}
/* Open-Meteo geeft straling als gemiddelde over het voorgaande uur: het uur dat om t begint hoort bij het label t+1 uur. */
function buildLiveWeather(j,now){
  var h=j&&j.hourly;
  if(!h||!Array.isArray(h.time))throw new Error('onverwacht antwoord');
  var names=['temperature_2m','cloud_cover','shortwave_radiation','direct_normal_irradiance','diffuse_radiation'],idx={},i,hasRh=Array.isArray(h.relative_humidity_2m)&&h.relative_humidity_2m.length===h.time.length;
  names.forEach(function(n){if(!Array.isArray(h[n])||h[n].length!==h.time.length)throw new Error('ontbrekende reeks '+n);});
  for(i=0;i<h.time.length;i++)idx[Date.parse(h.time[i]+'Z')]=i;
  var start=Math.floor(now/3600000)*3600000, lastKey=localOf(now+2*86400000).key;
  var o={temp:[],cloud:[],ghi:[],dni:[],dhi:[],rh:[]}, t=start, n=0;
  while(localOf(t).key<=lastKey&&n<120){
    var a=idx[t]; if(a===undefined)throw new Error('uur ontbreekt');
    var b=idx[t+3600000]; if(b===undefined)b=a;
    var vals=[h.temperature_2m[a],h.cloud_cover[a],h.shortwave_radiation[b],h.direct_normal_irradiance[b],h.diffuse_radiation[b]];
    for(i=0;i<5;i++){if(typeof vals[i]!=='number'||!isFinite(vals[i]))throw new Error('lege waarde');}
    o.temp.push(Math.round(vals[0]*10)/10);o.cloud.push(Math.round(vals[1]*10)/10);o.ghi.push(Math.round(vals[2]*10)/10);o.dni.push(Math.round(vals[3]*10)/10);o.dhi.push(Math.round(vals[4]*10)/10);
    if(hasRh&&typeof h.relative_humidity_2m[a]==='number')o.rh.push(Math.round(h.relative_humidity_2m[a]));else hasRh=false;
    t+=3600000;n++;
  }
  if(o.temp.length<24)throw new Error('te weinig uren');
  o.start=start;
  if(!hasRh||o.rh.length!==o.temp.length)delete o.rh;
  return o;
}
function buildLivePrices(j){
  if(!j||!Array.isArray(j.unix_seconds)||!Array.isArray(j.price)||j.unix_seconds.length!==j.price.length)throw new Error('onverwacht antwoord');
  var days={},i,k,out={};
  for(i=0;i<j.unix_seconds.length;i++){
    var p=j.price[i]; if(typeof p!=='number'||!isFinite(p))continue;
    var l=localOf(j.unix_seconds[i]*1000);
    (days[l.key]=days[l.key]||{});(days[l.key][l.h]=days[l.key][l.h]||[]).push(p);
  }
  Object.keys(days).forEach(function(key){
    var hrs=days[key],cnt={},ok=true,v=[];
    for(k=0;k<24;k++){if(!hrs[k]){ok=false;break;}cnt[hrs[k].length]=1;v.push(Math.round(hrs[k].reduce(function(a,b){return a+b;},0)/hrs[k].length*100)/100);}
    if(ok&&Object.keys(cnt).length===1)out[key]=v;
  });
  return out;
}
function dateKey(ms){return localOf(ms).key;}
var liveBusy=false;
function liveRefresh(){
  if(liveBusy||typeof fetch!=='function')return Promise.resolve();
  liveBusy=true;
  var now=Date.now(),d0=dateKey(now),d2=dateKey(now+2*86400000);
  var wUrl='https://api.open-meteo.com/v1/forecast?latitude='+LAT.toFixed(4)+'&longitude='+LON.toFixed(4)+'&models=knmi_seamless&timezone=GMT&forecast_days=4&past_days=1&hourly=temperature_2m,cloud_cover,shortwave_radiation,direct_normal_irradiance,diffuse_radiation,relative_humidity_2m';
  var pUrl='https://api.energy-charts.info/price?bzn=NL&start='+d0+'&end='+d2;
  var nowD=new Date(now), stampTxt=dshort.format(nowD).replace('.','')+' '+nowD.getFullYear()+', '+clock(now);
  var changed=false;
  return Promise.all([
    fetchJson(wUrl).then(function(j){
      var w=buildLiveWeather(j,now);
      SNAP.start=w.start;SNAP.temp=w.temp;SNAP.cloud=w.cloud;SNAP.ghi=w.ghi;SNAP.dni=w.dni;SNAP.dhi=w.dhi;if(w.rh)SNAP.rh=w.rh;else delete SNAP.rh;
      SNAP.src='KNMI HARMONIE via Open-Meteo.com (CC BY 4.0)';SNAP.stamp=stampTxt;SNAP.fetched=now;changed=true;
    }).catch(function(){}),
    fetchJson(pUrl).then(function(j){
      var fresh=buildLivePrices(j);
      if(Object.keys(fresh).length){
        var ep={};Object.keys(SNAP.epex||{}).forEach(function(k){if(k>=d0)ep[k]=SNAP.epex[k];});
        Object.keys(fresh).forEach(function(k){ep[k]=fresh[k];});
        SNAP.epex=ep;SNAP.epexStamp=stampTxt;changed=true;
      }
    }).catch(function(){})
  ]).then(function(){
    liveBusy=false;
    if(changed&&booted){
      cache={};DAYS=buildDays();
      if(ui.day>=DAYS.length)ui.day=0;
      $('stamp').textContent='Weer van '+SNAP.stamp;
      if(SNAP.src)$('wxsrc').textContent='Weergegevens: '+SNAP.src+'.';
      renderActive();
    }
  });
}
/* Middernacht en uurwissel: dagen opnieuw opbouwen, zonder dat ophalen hoeft te lukken. */
var tickKey=null,tickHour=null;
function clockTick(){
  if(!booted)return;
  var l=localOf(Date.now());
  if(tickKey===null){tickKey=l.key;tickHour=l.h;return;}
  if(l.key===tickKey&&l.h===tickHour)return;
  var newDay=l.key!==tickKey;
  tickKey=l.key;tickHour=l.h;
  var nd;try{nd=buildDays();}catch(e){nd=[];}
  if(nd.length){DAYS=nd;if(newDay)ui.day=0;else if(ui.day>=DAYS.length)ui.day=0;}
  cache={};
  if(newDay||!curTouched)curK=null;
  if(newDay)curTouched=false;
  try{renderActive();}catch(e){}
}
setInterval(clockTick,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)clockTick();});
var booted=false;
function boot(d,s){
  if(booted)return;
  booted=true;
  try{applyData(d);}catch(e){}
  try{if(s&&typeof s==='object'){DEF=merge(clone(DEF),s);st=clone(DEF);}}catch(e){}
  DAYS=buildDays();
  init();
  measRemoteLoad().then(function(){afterMeasChange();});
}
if(typeof fetch==='function'&&/^https?:$/.test(location.protocol)){
  Promise.all([getJson('data.json'),getJson('settings.json'),getJson('indoor.json'),getJson('outside.json')]).then(function(r){try{if(r[2]&&typeof r[2]==='object')IND=r[2];if(r[3]&&typeof r[3]==='object')OUT=r[3];}catch(e){}boot(r[0],r[1]);liveRefresh();});
  setInterval(function(){if(booted)liveRefresh();},1800000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&booted&&SNAP.fetched&&Date.now()-SNAP.fetched>1200000)liveRefresh();});
  setInterval(function(){Promise.all([getJson('indoor.json'),getJson('outside.json')]).then(function(r){if(!booted)return;if(r[0]&&typeof r[0]==='object')IND=r[0];if(r[1]&&typeof r[1]==='object')OUT=r[1];measStatus();renderActive();});},300000);
  setTimeout(function(){boot();liveRefresh();},2500);
}else boot();
})();
